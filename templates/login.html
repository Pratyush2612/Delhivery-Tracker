<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — SwiftLogic Courier Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --bg2: #f6f8fc;
      --gold: #e89b1e;
      --gold2: #f5b041;
      --gold-bg: rgba(232,155,30,0.09);
      --gold-br: rgba(232,155,30,0.28);
      --teal: #0d9b7a;
      --rose: #e55a5a;
      --text: #1a1d2e;
      --text2: #5a647a;
      --text3: #8b93a7;
      --border: #e2e6f0;
      --mono: "IBM Plex Mono", monospace;
      --sans: Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      color: var(--text);
      background: linear-gradient(180deg, #fafbff 0%, #fff 220px);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 28px 28px;
      box-shadow: 0 4px 24px rgba(26, 29, 46, 0.06);
    }
    .brand {
      font-family: var(--mono);
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 4px;
    }
    .brand em { color: var(--gold); font-style: normal; }
    .eyebrow {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 18px;
    }
    h1 {
      font-family: var(--mono);
      font-size: 1.35rem;
      margin-bottom: 6px;
    }
    .lede {
      color: var(--text2);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    label {
      display: block;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 12px;
      font-family: var(--sans);
      font-size: 0.95rem;
      margin-bottom: 14px;
      background: #fff;
    }
    input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-bg);
    }
    button {
      width: 100%;
      font-family: var(--mono);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--gold);
      background: var(--gold);
      color: #fff;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: var(--gold2); }
    .error {
      background: rgba(229, 90, 90, 0.1);
      color: var(--rose);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .error.show { display: block; }
    .hint {
      margin-top: 16px;
      font-size: 0.75rem;
      color: var(--text3);
      text-align: center;
      font-family: var(--mono);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">SwiftLogic<em> AI</em></div>
    <p class="eyebrow">Courier tracker</p>
    <h1>Sign in</h1>
    <p class="lede">Ops access for the Shiprocket / Delhivery live tracker.</p>

    <div id="error" class="error"></div>

    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username" placeholder="ops@swiftlogic.ai" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />

      <button type="submit">Log in</button>
    </form>

    <p class="hint">Credentials from LOGIN_EMAIL / LOGIN_PASSWORD</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const err = params.get("error");
    if (err) {
      const el = document.getElementById("error");
      el.textContent = decodeURIComponent(err.replace(/\+/g, " "));
      el.classList.add("show");
    }
  </script>
</body>
</html>
